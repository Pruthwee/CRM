apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-component-pruthwee
  namespace: crm-component-pruthwee
  labels:
    app: crm-component-pruthwee
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crm-component-pruthwee
  template:
    metadata:
      labels:
        app: crm-component-pruthwee
        version: v1
    spec:
      containers:
      - name: crm-component-pruthwee
        image: {{IMAGE_URI}}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8081
          name: management
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: SPRING_DATASOURCE_URL
          value: "{{SPRING_DATASOURCE_URL}}"
        - name: SPRING_DATASOURCE_USERNAME
          value: "{{SPRING_DATASOURCE_USERNAME}}"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "{{SPRING_DATASOURCE_PASSWORD}}"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: MANAGEMENT_SECURITY_ENABLED
          value: "false"
        - name: MANAGEMENT_CONTEXT_PATH
          value: "/actuator"
        - name: ENDPOINTS_HEALTH_ENABLED
          value: "true"
        - name: ENDPOINTS_HEALTH_SENSITIVE
          value: "false"
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
        - name: TZ
          value: "UTC"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
      restartPolicy: Always
