apiVersion: v1
kind: Service
metadata:
  name: crm-container-service
  namespace: crm-container
  labels:
    app: crm-container
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: management
  selector:
    app: crm-container
