version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: crm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-password}
      MYSQL_DATABASE: crm
      MYSQL_USER: ${DATABASE_USERNAME:-crmuser}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm-network

  # CRM Application Service
  crm-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-application
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      DATABASE_URL: jdbc:mysql://mysql:3306/crm?useSSL=false&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: ${DATABASE_USERNAME:-crmuser}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-password}
      DB_DDL_AUTO: update
      SERVER_PORT: 8080
      LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/appinfo/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - crm-network
    restart: unless-stopped

volumes:
  mysql-data:
    driver: local

networks:
  crm-network:
    driver: bridge
