version: '3.8'

services:
  crm-container:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-container:latest
    container_name: crm-container
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-host:3306/crm?useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password
      - MANAGEMENT_SECURITY_ENABLED=false
      - MANAGEMENT_CONTEXT_PATH=/appinfo
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport
    networks:
      - crm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  crm-network:
    driver: bridge
