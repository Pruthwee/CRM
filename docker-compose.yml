version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: crm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: crm
      MYSQL_USER: crmuser
      MYSQL_PASSWORD: crmpass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm-network

  # Redis for Session Management
  redis:
    image: redis:6-alpine
    container_name: crm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - crm-network

  # CRM Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-app
    ports:
      - "8080:8080"
    environment:
      # Database Configuration
      DB_URL: jdbc:mysql://mysql:3306/crm?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: crmuser
      DB_PASSWORD: crmpass
      DB_DDL_AUTO: update
      DB_POOL_SIZE: 10
      DB_POOL_MIN_IDLE: 5
      
      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_STORE_TYPE: redis
      
      # Application Configuration
      SESSION_TIMEOUT: 1800
      LOG_LEVEL: INFO
      THYMELEAF_CACHE: false
      
      # Spring Profile
      SPRING_PROFILES_ACTIVE: default
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/appinfo/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - crm-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  crm-network:
    driver: bridge
