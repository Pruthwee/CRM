version: "3.8"

services:
  crm-testing:
    image: crm-testing:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-testing
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - DB_URL=${DB_URL:-jdbc:h2:mem:crmdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
      - DB_USERNAME=${DB_USERNAME:-sa}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - TZ=UTC
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - ./config:/app/config

networks:
  app-network:
    driver: bridge
