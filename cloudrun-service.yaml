apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: crm-application
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:INSTANCE_NAME
        run.googleapis.com/client-name: cloud-console
    spec:
      serviceAccountName: crm-sa@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/PROJECT_ID/crm:latest
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: crm-secrets
              key: database-url
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: crm-secrets
              key: db-username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: crm-secrets
              key: db-password
        - name: GCS_BUCKET_NAME
          value: "your-gcs-bucket-name"
        - name: GCP_PROJECT_ID
          value: "your-gcp-project-id"
        - name: DB_POOL_SIZE
          value: "10"
        - name: DB_MIN_IDLE
          value: "2"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          limits:
            memory: "1Gi"
            cpu: "1000m"
