apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: crm-app
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '10'
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:INSTANCE_NAME
        run.googleapis.com/client-name: cloud-console
    spec:
      serviceAccountName: crm-app@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/PROJECT_ID/crm-app:latest
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: PORT
          value: '8080'
        - name: GCS_BUCKET_NAME
          value: 'crm-storage-bucket'
        - name: GCP_PROJECT_ID
          value: 'PROJECT_ID'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-url
              key: latest
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: database-username
              key: latest
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-password
              key: latest
        - name: DB_POOL_SIZE
          value: '5'
        - name: LOG_LEVEL
          value: 'INFO'
        resources:
          limits:
            memory: 1Gi
            cpu: '1'
        startupProbe:
          httpGet:
            path: /appinfo/health
            port: 8080
          initialDelaySeconds: 0
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /appinfo/health
            port: 8080
          initialDelaySeconds: 0
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 3
