steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/crm-app:$COMMIT_SHA', '.']
    timeout: 600s

  # Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/crm-app:$COMMIT_SHA']

  # Tag as latest
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'gcr.io/$PROJECT_ID/crm-app:$COMMIT_SHA', 'gcr.io/$PROJECT_ID/crm-app:latest']

  # Push latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/crm-app:latest']

  # Deploy to Cloud Run (optional)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'crm-app'
      - '--image=gcr.io/$PROJECT_ID/crm-app:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=SPRING_PROFILES_ACTIVE=gcp,GCS_BUCKET_NAME=${_GCS_BUCKET_NAME},GCP_PROJECT_ID=$PROJECT_ID'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--max-instances=10'
      - '--timeout=300'

# Images to be pushed to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/crm-app:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/crm-app:latest'

# Build timeout
timeout: 1200s

# Substitutions for environment-specific values
substitutions:
  _GCS_BUCKET_NAME: 'crm-data-bucket'

# Options
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
