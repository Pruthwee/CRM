events {
    worker_connections 1024;
}

http {
    # Upstream configuration for CRM application instances
    upstream crm_backend {
        # Round-robin load balancing (no sticky sessions needed)
        # This simulates AWS Application Load Balancer behavior
        server app1:8080;
        server app2:8080;
        
        # Health check configuration
        # Nginx will automatically remove unhealthy instances
    }

    # Main server configuration
    server {
        listen 80;
        server_name localhost;

        # Access and error logs
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Proxy settings for backend
        location / {
            proxy_pass http://crm_backend;
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # No sticky sessions - demonstrates cloud-native stateless architecture
            # Sessions are managed by Redis, so any instance can handle any request
        }

        # Health check endpoint
        location /actuator/health {
            proxy_pass http://crm_backend/actuator/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # Static content caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
            proxy_pass http://crm_backend;
            proxy_cache_valid 200 1h;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }
    }
}
