# Cloud-Native Configuration for Azure Deployment
# Use environment variables for sensitive data and deployment-specific settings

# Database Configuration - Use environment variables for cloud deployment
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:create-drop}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

# Connection Pool Configuration for Cloud Environments
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# Actuator Configuration
management.security.enabled=false
management.context-path=/appinfo
management.endpoints.web.exposure.include=health,info,metrics

# Thymeleaf Configuration
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Timezone Configuration - Use UTC for cloud consistency
app.timezone.display=${APP_TIMEZONE:UTC}
app.datetime.format=${APP_DATETIME_FORMAT:yyyy-MM-dd'T'HH:mm:ss'Z'}

# Azure Storage Configuration
azure.storage.enabled=${AZURE_STORAGE_ENABLED:false}
azure.storage.blob.container.name=${AZURE_BLOB_CONTAINER:pdf-documents}
azure.storage.connection.string=${AZURE_STORAGE_CONNECTION_STRING:}

# PDF Storage Configuration
pdf.storage.path=${PDF_STORAGE_PATH:/tmp/pdfs}

# CSV Processing Configuration
csv.processing.enabled=${CSV_PROCESSING_ENABLED:false}
csv.default.resource=${CSV_DEFAULT_RESOURCE:data/sample.csv}

# Logging Configuration for Cloud Environments
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.crm=${LOG_LEVEL_APP:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Server Configuration - Use environment variable for port
server.port=${PORT:8080}
