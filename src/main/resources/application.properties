# Database Configuration - Use environment variables for cloud deployment
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}
# Management endpoints
# Thymeleaf configuration

# Redis Session Configuration for distributed session management
# This enables horizontal scaling and stateless architecture
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=${REDIS_TIMEOUT:2000ms}

# Redis connection pool configuration
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.redis.lettuce.pool.max-wait=-1ms

# Session timeout configuration
spring.session.timeout=${SESSION_TIMEOUT:1800s}
server.servlet.session.timeout=${SESSION_TIMEOUT:1800s}
spring.session.redis.flush-mode=on-save
spring.thymeleaf.cache=false
