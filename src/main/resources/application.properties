spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false
management.context-path=/appinfo

# -----------------------------------------------------------------------
# Amazon S3 configuration (cr-java-0061 – replaces hard-coded file paths)
# Set these as environment variables in your cloud deployment environment.
# -----------------------------------------------------------------------
# AWS_S3_BUCKET_NAME=<your-s3-bucket-name>
# AWS_REGION=<aws-region, e.g. us-east-1>
cloud.aws.s3.bucket=${AWS_S3_BUCKET_NAME:crm-data-bucket}
cloud.aws.region=${AWS_REGION:us-east-1}
