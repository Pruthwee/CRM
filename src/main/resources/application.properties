# Database Configuration - Use environment variables for cloud deployment
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}
# Actuator Configuration
# Thymeleaf Configuration

# Redis Session Configuration for Cloud-Native Stateless Architecture
# These values should be overridden via environment variables in cloud deployment
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=${REDIS_TIMEOUT:2000}

# Redis Connection Pool Configuration
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.redis.lettuce.pool.max-wait=-1ms

# Session Configuration
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=spring:session
server.servlet.session.timeout=30m

# AWS ElastiCache Redis Configuration (for production)
# Set REDIS_HOST to your ElastiCache endpoint, e.g., my-redis-cluster.abc123.0001.use1.cache.amazonaws.com
spring.thymeleaf.cache=false
