# Database Configuration - Use environment variables for cloud deployment
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}
# Actuator Configuration
# Thymeleaf Configuration

# AWS Configuration - Cloud-native settings
# AWS region (override via AWS_REGION environment variable)
aws.region=${AWS_REGION:us-east-1}

# S3 Bucket Configuration (override via environment variables)
aws.s3.bucket.name=${AWS_S3_BUCKET:crm-storage-bucket}
aws.s3.pdf.prefix=${AWS_S3_PDF_PREFIX:pdfs/}
aws.s3.csv.prefix=${AWS_S3_CSV_PREFIX:csv/}

# Application runs in UTC timezone for cloud consistency
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.thymeleaf.cache=false
