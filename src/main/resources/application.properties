spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false
management.context-path=/appinfo

spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# AWS S3 Configuration for cloud-native file storage
# These values can be overridden by environment variables (S3_BUCKET_NAME, AWS_REGION)
# AWS credentials should be provided via IAM roles (recommended) or environment variables
# In AWS environments (ECS, EKS, Lambda), IAM roles will be used automatically
# For local development, use AWS CLI configuration or environment variables:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
aws.s3.bucket.name=${S3_BUCKET_NAME:crm-data-bucket}
aws.region=${AWS_REGION:us-east-1}

# Note: Ensure the S3 bucket exists and the application has appropriate IAM permissions
