spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false
management.context-path=/appinfo

spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# AWS SDK wire and request logs can hold secrets: keep them at WARN
logging.level.software.amazon.awssdk=WARN
logging.level.software.amazon.awssdk.request=WARN
logging.level.org.apache.http.wire=WARN
logging.level.org.apache.http.headers=WARN
logging.level.org.apache.hc.client5.http.wire=WARN
logging.level.org.apache.hc.client5.http.headers=WARN
