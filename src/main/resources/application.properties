spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false

# AWS S3 Configuration for cloud-native file storage
# Replace local file system operations with durable S3 storage
# These values can be overridden via environment variables in cloud deployments
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:crm-pdf-storage}
aws.s3.region=${AWS_REGION:us-east-1}
# AWS credentials are managed via DefaultAWSCredentialsProviderChain
# Supports IAM roles, environment variables (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY), and credential files
spring.thymeleaf.cache=false
