# Database Configuration - Cloud-ready with environment variables
# Use Cloud SQL for production deployments
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:create-drop}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# Connection Pool Configuration for Cloud Environments
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# Management/Actuator Configuration
management.security.enabled=false
management.context-path=/appinfo

# Thymeleaf Configuration
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Google Cloud Storage Configuration
gcs.bucket.name=${GCS_BUCKET_NAME:crm-storage-bucket}
gcs.project.id=${GCP_PROJECT_ID:}
gcs.pdf.folder=${GCS_PDF_FOLDER:pdfs}
gcs.csv.folder=${GCS_CSV_FOLDER:csv-files}

# Server Configuration - Cloud-ready port binding
server.port=${PORT:8080}

# Logging Configuration for Cloud Environments
logging.level.root=${LOG_LEVEL:INFO}
logging.level.crm=${APP_LOG_LEVEL:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Cloud-specific settings
# Enable graceful shutdown for container orchestration
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
