# Database Configuration - Use environment variables for cloud deployment
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

# HikariCP Connection Pool Configuration for Cloud
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# Actuator Management Security - Enable for cloud
management.security.enabled=${MANAGEMENT_SECURITY_ENABLED:true}
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,metrics}
management.endpoint.health.show-details=${HEALTH_DETAILS:when-authorized}

# Thymeleaf Configuration
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Logging Configuration for Cloud - Use JSON format for structured logging
logging.pattern.console=${LOGGING_PATTERN:%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n}
logging.level.root=${LOG_LEVEL:INFO}
logging.level.crm=${APP_LOG_LEVEL:INFO}
