spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Database connection pool configuration for cloud environments
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}

management.security.enabled=${MANAGEMENT_SECURITY_ENABLED:true}
management.endpoints.web.base-path=${MANAGEMENT_BASE_PATH:/actuator}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when-authorized}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_EXPOSURE:health,info,metrics}

spring.thymeleaf.mode=${THYMELEAF_MODE:HTML}
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Server configuration for cloud environments
server.port=${PORT:8080}
server.servlet.context-path=${CONTEXT_PATH:}

# Application-specific configuration
app.pdf.storage.path=${PDF_STORAGE_PATH:${java.io.tmpdir}/crm-pdfs}

# Logging configuration for cloud environments
logging.level.crm=${LOG_LEVEL_CRM:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
logging.pattern.console=${LOG_PATTERN:%d{yyyy-MM-dd HH:mm:ss} - %msg%n}
