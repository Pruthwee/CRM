# Cloud-Native Configuration for GCP Deployment
# Uses environment variables for dynamic configuration

# Database Configuration - Use Cloud SQL or external database
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

# HikariCP Connection Pool Configuration (Cloud-Ready)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# Management and Actuator Configuration
management.security.enabled=false
management.context-path=/appinfo
management.endpoints.web.exposure.include=health,info,metrics

# Thymeleaf Configuration
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Server Configuration - Use environment variable for port
server.port=${PORT:8080}

# Logging Configuration - Structured logging for cloud monitoring
logging.level.root=${LOG_LEVEL:INFO}
logging.level.crm=${APP_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Google Cloud Platform Configuration
# GCS Bucket for file storage
gcp.storage.bucket=${GCS_BUCKET_NAME:}
gcp.storage.file-path-prefix=${FILE_PATH_PREFIX:}

# Firestore Configuration
gcp.firestore.project-id=${GCP_PROJECT_ID:}

# CSV Processing Configuration
csv.file.path=${CSV_FILE_PATH:}
csv.default.filename=${DEFAULT_FILE_NAME:}

# Time Zone Configuration - Always use UTC for distributed systems
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
