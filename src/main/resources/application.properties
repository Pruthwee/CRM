# Database Configuration - Use environment variables for cloud deployment
# For AWS: Use RDS endpoint, credentials from AWS Secrets Manager
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:create-drop}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

# Connection Pool Configuration for Cloud Environments
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# Actuator Configuration
management.security.enabled=false
management.context-path=/appinfo

# Thymeleaf Configuration
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Session Management - STATELESS for Cloud Compatibility
# IMPORTANT: For cloud deployment, use external session store (Redis/Hazelcast)
# or ensure application is fully stateless
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Cloud-Ready: Disable session persistence to local filesystem
server.servlet.session.persistent=false

# Logging Configuration for Cloud Environments
logging.level.root=${LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Server Configuration - Use environment variable for port
server.port=${PORT:8080}

# CLOUD DEPLOYMENT NOTES:
# 1. All sensitive configuration should be externalized to environment variables
# 2. For AWS deployment, use:
#    - RDS for database (update DATABASE_URL)
#    - Secrets Manager for credentials
#    - ElastiCache Redis for distributed sessions (if needed)
#    - CloudWatch for logging and monitoring
# 3. Ensure application is stateless - no local file storage
# 4. Use load balancer health checks on /appinfo/health
