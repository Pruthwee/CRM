# Database Configuration - Use environment variables for cloud deployment
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}
# Management endpoints
# Thymeleaf configuration

# Redis Session Configuration for Cloud-Native Distributed Session Management
# This enables horizontal scaling by storing sessions in Redis instead of in-memory
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=2000ms

# Redis connection pool configuration for cloud resilience
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=2
spring.redis.lettuce.pool.max-wait=-1ms

# Session timeout configuration (30 minutes)
spring.session.timeout=1800s
server.servlet.session.timeout=30m
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=spring:session
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false
