spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false
management.context-path=/appinfo

spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# AWS S3 Configuration for cloud-native file storage
# Replaces local file system dependencies (cr-java-0061, cr-java-0062, cr-java-0063)
# Override these values via environment variables in cloud deployments:
#   AWS_REGION, AWS_S3_BUCKET_NAME
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:crm-data-storage}
aws.s3.pdf-prefix=${AWS_S3_PDF_PREFIX:pdfs/}
aws.s3.csv-prefix=${AWS_S3_CSV_PREFIX:csv/}
