# Cloud-Ready Configuration for AWS Deployment
# All hardcoded values replaced with environment variables

# Database Configuration - Use environment variables for cloud deployment
# For AWS RDS MySQL:
# - Set DB_URL to your RDS endpoint (e.g., jdbc:mysql://mydb.xxxxx.us-east-1.rds.amazonaws.com:3306/crm?useSSL=true)
# - Set DB_USERNAME to your RDS master username
# - Set DB_PASSWORD to your RDS master password (use AWS Secrets Manager in production)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# Connection Pool Configuration for Cloud (HikariCP - default in Spring Boot)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# JPA Configuration
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQL5InnoDBDialect}

# Actuator Configuration - Secured for cloud deployment
management.security.enabled=${MANAGEMENT_SECURITY_ENABLED:true}
management.context-path=${MANAGEMENT_CONTEXT_PATH:/appinfo}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,metrics}

# Server Configuration - Use environment variable for port
server.port=${PORT:8080}

# Thymeleaf Configuration
spring.thymeleaf.mode=${THYMELEAF_MODE:LEGACYHTML5}
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Logging Configuration for Cloud (JSON format for CloudWatch)
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.crm=${LOG_LEVEL_APP:INFO}
logging.pattern.console=${LOG_PATTERN:%d{yyyy-MM-dd HH:mm:ss} - %msg%n}

# File Upload Configuration (for cloud-ready file handling)
spring.servlet.multipart.enabled=${MULTIPART_ENABLED:true}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# AWS Configuration (optional - for S3 integration)
# aws.region=${AWS_REGION:us-east-1}
# aws.s3.bucket=${S3_BUCKET_NAME:crm-files-bucket}

# Application Configuration
spring.application.name=${APP_NAME:crm-application}
