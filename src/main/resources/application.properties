# Database Configuration - Use environment variables for cloud deployment
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# HikariCP Connection Pool Configuration for Cloud Resilience
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# Redis Session Configuration for Distributed Session Management
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=${REDIS_TIMEOUT:2000}
spring.redis.database=${REDIS_DATABASE:0}

# Redis Connection Pool Configuration
spring.redis.jedis.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.redis.jedis.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.redis.jedis.pool.min-idle=${REDIS_POOL_MIN_IDLE:0}
spring.redis.jedis.pool.max-wait=${REDIS_POOL_MAX_WAIT:-1}

# Spring Session Configuration
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=crm:session

# Actuator Configuration - Disable security for health checks
management.security.enabled=false
management.context-path=/appinfo

# Thymeleaf Configuration
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Server Configuration - Use environment variable for port
server.port=${SERVER_PORT:8080}

# Logging Configuration for Cloud Monitoring
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.crm=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.session=${LOG_LEVEL_SESSION:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
