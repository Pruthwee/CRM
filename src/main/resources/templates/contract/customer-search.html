<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"/>
    <meta charset="UTF-8"/>
    <title>Search contracts by customer</title>
</head>
<body>

<h2>Search contracts by customer</h2>
<form th:action="@{|/contract/customer-search|}" th:object="${contract}" method="post">
    <div>
        <label>
            Customer:
            <select th:field="*{customer.id}">
                <option th:each="customer : ${customers}"
                        th:value="${customer.id}" th:text="${customer}">
                </option>
            </select>
        </label>
    </div>
    <div>
        <input type="submit" value="Search Contract"/>
    </div>
</form>

</body>
</html>
