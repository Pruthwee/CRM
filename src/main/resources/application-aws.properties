# AWS Cloud Profile Configuration
# Use this profile when deploying to AWS: --spring.profiles.active=aws

# Database Configuration - AWS RDS MySQL
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# HikariCP Connection Pool for AWS RDS
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Management Security - Enabled
management.security.enabled=true
management.context-path=/appinfo

# Thymeleaf Production Settings
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=true

# AWS S3 Configuration
aws.s3.enabled=true
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME}
aws.s3.region=${AWS_REGION:us-east-1}

# Server Configuration
server.port=${PORT:8080}

# Logging Configuration for CloudWatch
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.level.root=INFO
logging.level.crm=INFO
