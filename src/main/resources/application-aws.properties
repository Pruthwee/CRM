# AWS Cloud Deployment Configuration
# This file provides environment variable configuration for AWS deployment

# Database Configuration (AWS RDS MySQL)
# Replace with your AWS RDS endpoint
DB_URL=jdbc:mysql://your-rds-endpoint.region.rds.amazonaws.com:3306/crm?useSSL=true&requireSSL=true
DB_USERNAME=admin
DB_PASSWORD=${AWS_RDS_PASSWORD}
DB_DDL_AUTO=update

# Database Connection Pool Configuration
DB_POOL_SIZE=20
DB_POOL_MIN_IDLE=5
DB_CONNECTION_TIMEOUT=30000
DB_IDLE_TIMEOUT=600000
DB_MAX_LIFETIME=1800000

# Redis Session Configuration (AWS ElastiCache Redis)
# Replace with your AWS ElastiCache Redis endpoint
REDIS_HOST=your-elasticache-endpoint.region.cache.amazonaws.com
REDIS_PORT=6379
REDIS_PASSWORD=${AWS_ELASTICACHE_PASSWORD}
REDIS_TIMEOUT=2000
REDIS_DATABASE=0

# Redis Connection Pool Configuration
REDIS_POOL_MAX_ACTIVE=20
REDIS_POOL_MAX_IDLE=10
REDIS_POOL_MIN_IDLE=5
REDIS_POOL_MAX_WAIT=3000

# Server Configuration
SERVER_PORT=8080

# Logging Configuration
LOG_LEVEL_ROOT=INFO
LOG_LEVEL_APP=INFO
LOG_LEVEL_SESSION=INFO

# Thymeleaf Configuration
THYMELEAF_CACHE=true

# AWS Deployment Notes:
# 1. Store sensitive values (passwords) in AWS Secrets Manager or Parameter Store
# 2. Use IAM roles for EC2/ECS instances to access AWS services
# 3. Configure security groups to allow traffic between application and RDS/ElastiCache
# 4. Enable CloudWatch logging for application monitoring
# 5. Use Application Load Balancer for distributing traffic across instances
# 6. Configure Auto Scaling Group for horizontal scaling
# 7. Use AWS Certificate Manager for SSL/TLS certificates
