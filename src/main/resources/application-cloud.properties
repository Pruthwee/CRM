# Cloud Deployment Configuration Profile
# Activate this profile with: --spring.profiles.active=cloud
# Or set environment variable: SPRING_PROFILES_ACTIVE=cloud

# ============================================================================
# DATABASE CONFIGURATION - AWS RDS
# ============================================================================
# Use environment variables for cloud deployment
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

# Connection pool configuration for cloud
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect

# ============================================================================
# REDIS SESSION CONFIGURATION - AWS ELASTICACHE
# ============================================================================
# Redis connection settings
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=${REDIS_TIMEOUT:2000}
spring.redis.ssl=${REDIS_SSL:false}

# Redis connection pool configuration
spring.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:0}
spring.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:-1ms}

# Session configuration
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=spring:session:crm
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ============================================================================
# ACTUATOR CONFIGURATION - HEALTH CHECKS
# ============================================================================
management.security.enabled=false
management.context-path=/appinfo
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.redis.enabled=true
management.health.db.enabled=true

# ============================================================================
# LOGGING CONFIGURATION - CLOUD MONITORING
# ============================================================================
# Log to console for cloud log aggregation (CloudWatch, Stackdriver, etc.)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.crm=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING_WEB:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SPRING_SECURITY:INFO}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:WARN}

# ============================================================================
# THYMELEAF CONFIGURATION
# ============================================================================
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.thymeleaf.encoding=UTF-8

# ============================================================================
# SECURITY CONFIGURATION
# ============================================================================
# HTTPS enforcement (set to true in production)
security.require-ssl=${REQUIRE_SSL:false}

# ============================================================================
# AWS SPECIFIC CONFIGURATION
# ============================================================================
# AWS Region
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.region.auto=false

# Disable CloudFormation stack configuration
cloud.aws.stack.auto=false

