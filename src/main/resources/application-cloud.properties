# Cloud-Specific Configuration Profile
# Activate this profile in cloud environments: -Dspring.profiles.active=cloud

# Database Configuration - Use AWS RDS or other cloud database services
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# HikariCP Connection Pool Configuration for Cloud Resilience
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION:60000}

# Redis Session Configuration - Use AWS ElastiCache, Azure Cache, or GCP Memorystore
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD}
spring.redis.ssl=${REDIS_SSL:true}
spring.redis.timeout=2000ms

# Redis connection pool configuration
spring.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:20}
spring.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:10}
spring.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:5}
spring.redis.lettuce.pool.max-wait=-1ms

# Session timeout configuration
spring.session.timeout=${SESSION_TIMEOUT:1800s}
server.servlet.session.timeout=${SESSION_TIMEOUT_MINUTES:30m}
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=spring:session:crm

# Server Configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Actuator Configuration for Cloud Health Checks
management.security.enabled=false
management.context-path=/actuator
management.health.redis.enabled=true
management.health.db.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Logging Configuration for Cloud Monitoring
logging.level.root=${LOG_LEVEL:INFO}
logging.level.crm=${APP_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Thymeleaf Configuration
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8

# Security Configuration
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
