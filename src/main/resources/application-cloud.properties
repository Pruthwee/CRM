# Cloud-Specific Configuration Profile
# Activate with: --spring.profiles.active=cloud

# Database Configuration for Cloud (AWS RDS)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# Redis Configuration for Cloud (AWS ElastiCache)
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD}
spring.redis.ssl=true
spring.redis.timeout=2000ms

# Session Configuration - Use Redis
spring.session.store-type=redis
server.servlet.session.timeout=30m

# Cache Configuration - Enable Distributed Cache
cache.enabled=true

# Cloud Storage Configuration (AWS S3)
cloud.storage.enabled=true
cloud.storage.bucket=${S3_BUCKET_NAME}
cloud.storage.region=${AWS_REGION:us-east-1}

# Logging Configuration for Cloud
logging.level.root=INFO
logging.level.crm=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator Configuration for Cloud Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Server Configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Thymeleaf Configuration
spring.thymeleaf.cache=true
