# Cloud-Specific Configuration Profile
# Activate this profile in cloud environments: -Dspring.profiles.active=cloud

# Database Configuration - Cloud Environment
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Connection Pool Configuration - Optimized for Cloud
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION:60000}

# Redis Session Configuration - Cloud Environment
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD}
spring.redis.timeout=${REDIS_TIMEOUT:2000}
spring.redis.ssl=${REDIS_SSL:true}
spring.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:2}
spring.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:2000}

# Session Configuration
spring.session.timeout=${SESSION_TIMEOUT:1800}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# Server Configuration
server.port=${SERVER_PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Thymeleaf Configuration - Production Settings
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Management Endpoints - Cloud Monitoring
management.security.enabled=false
management.context-path=/appinfo
management.health.redis.enabled=true
management.health.db.enabled=true

# Logging Configuration - Cloud-Native
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.crm=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.session=${LOG_LEVEL_SESSION:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Security Configuration
security.require-ssl=${REQUIRE_SSL:true}
