# Azure-specific configuration profile
# This file contains Azure cloud-specific settings
# Activate with: --spring.profiles.active=azure

# Azure Database Configuration
# Use Azure Database for MySQL connection string
spring.datasource.url=${DATABASE_URL:jdbc:mysql://your-server.mysql.database.azure.com:3306/crm?useSSL=true&requireSSL=true}
spring.datasource.username=${DATABASE_USERNAME:your-username@your-server}
spring.datasource.password=${DATABASE_PASSWORD:your-password}

# Azure-optimized connection pool settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Azure Blob Storage Configuration
azure.storage.enabled=true
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER:crm-files}

# Timezone - Always use UTC in cloud
spring.jackson.time-zone=UTC
app.display.timezone=${DISPLAY_TIMEZONE:UTC}

# Logging for Azure Application Insights
logging.level.root=INFO
logging.level.crm=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Server configuration
server.port=${PORT:8080}

# Actuator endpoints for Azure health monitoring
management.security.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
