# GCP-specific configuration profile
# Activate with: --spring.profiles.active=gcp

# Cloud SQL Configuration for GCP
spring.datasource.url=${DATABASE_URL:jdbc:mysql:///${DB_NAME:crm}?cloudSqlInstance=${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD}

# HikariCP Configuration optimized for Cloud SQL
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# GCS Configuration
gcs.bucket.name=${GCS_BUCKET_NAME:crm-data-bucket}
gcs.project.id=${GCP_PROJECT_ID}

# Server Configuration
server.port=${PORT:8080}

# Logging Configuration for GCP Cloud Logging
logging.level.root=INFO
logging.level.crm=DEBUG
logging.level.com.google.cloud=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n

# Actuator Configuration for GCP Health Checks
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.metrics.export.stackdriver.enabled=true
management.metrics.export.stackdriver.project-id=${GCP_PROJECT_ID}

# Thymeleaf Configuration
spring.thymeleaf.cache=true
spring.thymeleaf.mode=LEGACYHTML5
