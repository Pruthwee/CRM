# GCP-specific configuration profile
# Activate with: --spring.profiles.active=gcp

# GCP Cloud SQL Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

# GCP Cloud SQL Socket Factory (for Cloud SQL Proxy)
# Uncomment when using Cloud SQL
#spring.datasource.url=jdbc:mysql:///${DB_NAME:crm}?cloudSqlInstance=${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false
#spring.cloud.gcp.sql.instance-connection-name=${CLOUD_SQL_INSTANCE}
#spring.cloud.gcp.sql.database-name=${DB_NAME:crm}

# Connection Pool for Cloud
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# GCP Cloud Storage
gcp.storage.bucket-name=${GCP_STORAGE_BUCKET:crm-files-bucket}
gcp.storage.project-id=${GCP_PROJECT_ID:}
gcp.storage.credentials-path=${GOOGLE_APPLICATION_CREDENTIALS:}

# Logging for GCP Cloud Logging (JSON format)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Actuator endpoints for GCP health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true

# Server configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
