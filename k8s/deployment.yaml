apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-app
  labels:
    app: crm-app
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: crm-app
  template:
    metadata:
      labels:
        app: crm-app
        version: v1
    spec:
      serviceAccountName: crm-app-sa
      containers:
      - name: crm-app
        image: gcr.io/PROJECT_ID/crm-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: GCS_BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: crm-config
              key: gcs.bucket.name
        - name: GCP_PROJECT_ID
          valueFrom:
            configMapKeyRef:
              name: crm-config
              key: gcp.project.id
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: crm-secrets
              key: database.url
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: crm-secrets
              key: database.username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: crm-secrets
              key: database.password
        - name: DB_POOL_SIZE
          value: "10"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /appinfo/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /appinfo/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
---
apiVersion: v1
kind: Service
metadata:
  name: crm-app-service
  labels:
    app: crm-app
spec:
  type: LoadBalancer
  selector:
    app: crm-app
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  sessionAffinity: None
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-config
data:
  gcs.bucket.name: "crm-storage-bucket"
  gcp.project.id: "your-project-id"
  gcs.pdf.folder: "pdfs"
  gcs.csv.folder: "csv-files"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crm-app-sa
  annotations:
    iam.gke.io/gcp-service-account: crm-app@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: crm-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crm-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
